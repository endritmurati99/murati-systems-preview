# Murati Systems Website: statische Dateien aus ./site, HTTPS automatisch per Caddy.
services:
  caddy:
    image: caddy:2-alpine
    container_name: murati-website
    restart: unless-stopped
    ports:
      - "76.13.154.245:80:80"
      - "76.13.154.245:443:443"
      - "76.13.154.245:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
